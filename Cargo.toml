[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goatty-dev/goatty"
publish = false

[workspace.dependencies]
# Terminal core — pinned exactly; API still evolving (see docs/goatty-project-plan.md).
rio-vt = { version = "=0.5.29", default-features = false }
portable-pty = "0.9.0"
# GPUI from Zed main, pinned. Bump deliberately: `ZED_REV` below + `cargo update -p gpui`.
# (crates.io gpui 0.2.2 never recreates its Vulkan swapchain after
# VK_ERROR_OUT_OF_DATE_KHR, which froze the window on niri/Wayland.)
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", features = ["wayland", "x11"] }
parking_lot = "0.13"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_bytes = "0.11"
# Snapshots and history over remote links (goatty-proto).
zstd = { version = "0.14", default-features = false }
libc = "0.2"
getrandom = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
log = "0.4"
env_logger = "0.11"
flume = "0.12"
# Fast byte search (goatty-term: OSC 133 marks in the output stream).
memchr = "2"
clap = { version = "4", features = ["derive"] }
# `goatty completions` / `goattyd completions`, and their zsh functions in the managed shell.
clap_complete = "4"
tempfile = "3"
# The font picker finds monospace families by measuring glyph advances
# (goatty-app; tests also read the bundled font). Both are already in the
# tree through gpui.
ttf-parser = "0.25"
fontdb = "0.24"
# The color picker's OKLCH disc is a generated bitmap: gpui's `RenderImage`
# takes `image::Frame`s (already in the tree through gpui, same version).
image = { version = "0.25", default-features = false }
serde_json = "1"
# The output viewer (goatty-app): search with regular expressions, and column
# widths for wrapping (both already in the tree through gpui).
regex = "1"
unicode-width = "0.2"
# Settings documents: report the path of an invalid value.
serde_path_to_error = "0.1"
# Settings preview: diffs of generated shell config.
similar = "3"
# Managed tool installs (goatty-shell): verify + unpack release archives.
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
# Plugin packages in other formats (goatty-plugin `archive`): .zip and .tar.xz,
# both pure Rust (the static goattyd build has no C toolchain to spare).
zip = { version = "~9.7", default-features = false, features = ["deflate-flate2"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
# Plugins (goatty-plugin): TOML manifests, version requirements, signed registry indexes.
toml = "1.1"
semver = "1"
ed25519-dalek = "3"

goatty-term = { path = "crates/goatty-term" }
goatty-proto = { path = "crates/goatty-proto" }
goatty-client = { path = "crates/goatty-client" }
goatty-config = { path = "crates/goatty-config" }
goatty-daemon = { path = "crates/goatty-daemon" }
goatty-shell = { path = "crates/goatty-shell" }
goatty-plugin = { path = "crates/goatty-plugin" }
goatty-net = { path = "crates/goatty-net" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Terminal parsing/rendering is unusable at opt-level 0; keep deps fast.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"

# What releases ship (release.yml): the release build without debug info,
# a fifth of the size. Symbol names stay, so backtraces still name functions.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
