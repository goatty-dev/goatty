[package]
name = "goatty-term"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "goatty's TerminalEngine: a thin, UI-agnostic wrapper around rio-vt plus PTY helpers"

[dependencies]
rio-vt.workspace = true
rio-graphics.workspace = true
base64.workspace = true
# `icat`: the formats rio-vt's `graphics` feature already builds.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
# zlib-rs: several times faster than the default miniz_oxide, still pure
# Rust; images from shared memory are compressed and decompressed per frame.
flate2 = { workspace = true, features = ["zlib-rs"] }
parking_lot.workspace = true
anyhow.workspace = true
log.workspace = true
flume.workspace = true
memchr.workspace = true

[target.'cfg(unix)'.dependencies]
portable-pty.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "vtbench"

[lints]
workspace = true
