name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep panic backtraces readable; full debuginfo only bloats the
  # target dirs (the cache) and slows compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUST_LOG: rio_vt=error,warn

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  musl:
    # The static goattyd that goatty uploads to remote hosts (release.yml).
    name: goattyd static build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: cargo install --locked cargo-zigbuild
      - run: cargo zigbuild --release --locked -p goatty-daemon --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/release/goattyd --version

  check:
    name: clippy + tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for GPUI
        run: ./scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Benchmarks (smoke, small)
        # Catches gross regressions; the numbers on shared runners are not
        # comparable to docs/. Not on PRs: the examples are compiled by
        # clippy --all-targets there already.
        if: github.event_name != 'pull_request'
        run: |
          cargo build --release --locked -p goatty-daemon
          cargo run --release --locked -p goatty-term --example vtbench
          FLOOD_MB=50 cargo run --release --locked -p goatty-daemon --example netbench
          FLOOD_MB=50 cargo run --release --locked -p goatty-daemon --example netbench -- proxy

  macos:
    # goattyd on macOS (#97): plugin packages in every format, the managed
    # zsh, sessions. The GUI isn't built here.
    name: goattyd + plugins (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude goatty-app --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --no-fail-fast -p goatty-plugin -p goatty-shell -p goatty-term -p goatty-client -p goatty-daemon

  windows:
    # Full Windows build & tests: core platform, ConPTY, Named Pipes IPC, local
    # goattyd.exe (#277), managed PowerShell + Windows plugin framework (#278),
    # and goatty-app GPUI GUI (#279).
    name: clippy + tests (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # lld-link instead of link.exe: faster linking of the large goatty-app
      # test binaries.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast -- -q
