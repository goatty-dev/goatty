name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_LOG: rio_vt=error,warn

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  musl:
    # The static goattyd that goatty uploads to remote hosts (release.yml).
    name: goattyd static build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: cargo install --locked cargo-zigbuild
      - run: cargo zigbuild --release --locked -p goatty-daemon --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/release/goattyd --version

  check:
    name: clippy + tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for GPUI
        run: ./scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Benchmarks (smoke, small)
        # Keeps the examples compiling and catches gross regressions; the
        # numbers on shared runners are not comparable to docs/.
        run: |
          cargo build --release --locked -p goatty-daemon
          cargo run --release --locked -p goatty-term --example vtbench
          FLOOD_MB=50 cargo run --release --locked -p goatty-daemon --example netbench
          FLOOD_MB=50 cargo run --release --locked -p goatty-daemon --example netbench -- proxy

  macos:
    # goattyd on macOS (#97): plugin packages in every format, the managed
    # zsh, sessions. The GUI isn't built here.
    name: goattyd + plugins (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude goatty-app --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --no-fail-fast -p goatty-plugin -p goatty-shell -p goatty-term -p goatty-client -p goatty-daemon

  windows:
    # Core platform, ConPTY, Named Pipes IPC, and local goattyd.exe (#277).
    # Expanded to goatty-app once the Windows GUI issue (#279) lands.
    name: clippy + tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude goatty-app --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --locked --no-fail-fast -p goatty-proto -p goatty-config -p goatty-plugin -p goatty-term -p goatty-net -p goatty-client -p goatty-daemon
          cargo test --locked -p goatty-shell --lib dirs::tests
